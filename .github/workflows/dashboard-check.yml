name: Dashboard image verification
on:
  push:
    branches: [hd-creatives-v4]
    paths: ['.github/workflows/dashboard-check.yml', 'tools/verify_dashboard.py']
  workflow_dispatch:
permissions:
  contents: read
env:
  DASHBOARD_URL: https://emmanuelbarriosxcom-dev.github.io/partners-limos-dashboards/pl-rrss-07-11-sep-26.html?v=5
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install browser engines and image decoders
        run: |
          python -m pip install --quiet pillow beautifulsoup4 playwright
          python -m playwright install --with-deps chromium webkit
      - name: Wait for the verified file on the public URL
        run: |
          python - <<'PY'
          import os, time, urllib.request, pathlib
          url=os.environ['DASHBOARD_URL']
          out=pathlib.Path('verification');out.mkdir(exist_ok=True)
          for attempt in range(40):
              try:
                  request=urllib.request.Request(url,headers={'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(request,timeout=20) as response:
                      data=response.read()
                      if b'png-verified-5' in data:
                          (out/'published.html').write_bytes(data)
                          print('Verified public HTML:',response.status,len(data),'bytes')
                          break
              except Exception as error:
                  print(type(error).__name__)
              time.sleep(3)
          else:
              raise RuntimeError('The corrected public version was not served within the verification window')
          PY
      - name: Test the public dashboard on desktop and mobile
        run: python tools/verify_dashboard.py "$DASHBOARD_URL"
      - name: Verify mobile WebKit downloads
        run: |
          python - <<'PY'
          import os, io, json, hashlib, pathlib
          from PIL import Image
          from playwright.sync_api import sync_playwright
          out=pathlib.Path('verification')
          report={'engine':'webkit','downloads':{},'errors':[]}
          with sync_playwright() as p:
              browser=p.webkit.launch()
              context=browser.new_context(viewport={'width':390,'height':844},device_scale_factor=2,is_mobile=True,has_touch=True,accept_downloads=True)
              page=context.new_page()
              page.on('pageerror',lambda e:report['errors'].append(str(e)))
              response=page.goto(os.environ['DASHBOARD_URL'],wait_until='networkidle',timeout=60000)
              assert response.status==200
              assert page.locator('meta[name="dashboard-build"]').get_attribute('content')=='png-verified-5'
              for day in ['monday','wednesday','friday']:
                  image=page.locator('#creative-img-'+day)
                  image.evaluate('(img)=>img.decode()')
                  expected=image.get_attribute('data-sha256')
                  with page.expect_download(timeout=15000) as event:
                      page.locator('[data-download-creative="'+day+'"]').click()
                  download=event.value
                  path=out/('webkit-'+download.suggested_filename)
                  download.save_as(str(path))
                  data=path.read_bytes()
                  assert hashlib.sha256(data).hexdigest()==expected
                  im=Image.open(io.BytesIO(data));im.load();assert im.size==(1200,1200) and im.format=='PNG'
                  report['downloads'][day]={'dimensions':[1200,1200],'sha256':expected,'identical_to_preview':True}
              page.screenshot(path=str(out/'webkit-mobile-dashboard.png'),full_page=True)
              browser.close()
          assert not report['errors']
          report['passed']=True
          (out/'webkit-report.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-public-verification
          path: verification/
          retention-days: 3
