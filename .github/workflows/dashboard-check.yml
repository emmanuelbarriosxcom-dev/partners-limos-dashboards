name: Dashboard image verification
on:
  push:
    branches: [hd-creatives-v4]
    paths: ['.github/workflows/dashboard-check.yml', 'tools/repair_dashboard.py', 'tools/verify_dashboard.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install browser and image decoders
        run: |
          python -m pip install --quiet pillow beautifulsoup4 playwright
          python -m playwright install --with-deps chromium
      - name: Rebuild the existing dashboard with complete PNG creatives
        run: python tools/repair_dashboard.py
      - name: Verify all downloads, platforms, review controls and mobile layout
        run: python tools/verify_dashboard.py
      - name: Commit only the verified dashboard to the repair branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- pl-rrss-07-11-sep-26.html
          git diff --cached --quiet || git commit -m 'Fix corrupted creatives and embed matching lossless PNG downloads'
          git push origin HEAD:hd-creatives-v4
          cp pl-rrss-07-11-sep-26.html verification/
          git rev-parse HEAD > verification/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-verified-build
          path: verification/
          retention-days: 3
